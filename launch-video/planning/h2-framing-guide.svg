<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Inter, 'Hiragino Sans', sans-serif">
  <!-- H2R framing guide (planning/h2-redesign.md §3.3). Rects match timeline.json S02.press.roughRects.
       Schematic only: real perspective comes from the photo; keep the order, widths and zones. -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blur" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.55" stop-color="#0A0A0B" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A0A0B" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="#0A0A0B"/>

  <!-- upper rows (out of focus) -->
  <g fill="#17181B" opacity="0.7">
    <rect x="430" y="455" width="150" height="100" rx="10"/>
    <rect x="596" y="448" width="142" height="98" rx="10"/>
    <rect x="752" y="442" width="138" height="96" rx="10"/>
    <rect x="904" y="436" width="136" height="95" rx="10"/>
    <rect x="1054" y="430" width="134" height="94" rx="10"/>
    <rect x="1202" y="425" width="132" height="92" rx="10"/>
    <rect x="1348" y="420" width="130" height="90" rx="10"/>
    <rect x="1492" y="415" width="128" height="88" rx="10"/>
    <rect x="1634" y="410" width="126" height="86" rx="10"/>
    <rect x="1774" y="405" width="146" height="84" rx="10"/>
  </g>

  <!-- chassis / top case -->
  <path d="M330 760 L1920 700 L1920 760 L340 830 Q300 832 300 800 Z" fill="#1C1D20"/>

  <!-- bottom row: fn / control / option / command / space -->
  <g>
    <rect x="410" y="600" width="156" height="116" rx="12" fill="#141518" stroke="#3A3B40"/>
    <rect x="580" y="592" width="146" height="112" rx="12" fill="#141518" stroke="#3A3B40"/>
    <rect x="740" y="585" width="140" height="110" rx="12" fill="#18191C" stroke="#0A84FF" stroke-width="3"/>
    <rect x="894" y="578" width="190" height="110" rx="12" fill="#18191C" stroke="#F5F5F7" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="1098" y="570" width="822" height="112" rx="12" fill="#18191C" stroke="#0A84FF" stroke-width="3"/>
    <rect x="1098" y="570" width="822" height="4" fill="url(#rim)"/>
    <rect x="1098" y="560" width="822" height="140" fill="url(#blur)"/>
  </g>
  <!-- legends (as on a US Mac keyboard; real plate keeps its own engraving) -->
  <g fill="#C7C7CC" font-size="20">
    <text x="530" y="628" text-anchor="end">fn</text><text x="424" y="702">🌐</text>
    <text x="712" y="620" text-anchor="end">⌃</text><text x="712" y="690" text-anchor="end">control</text>
    <text x="866" y="613" text-anchor="end">⌥</text><text x="866" y="683" text-anchor="end">option</text>
    <text x="1070" y="606" text-anchor="end">⌘</text><text x="1070" y="676" text-anchor="end">command</text>
  </g>

  <!-- annotations -->
  <g font-size="22" fill="#F5F5F7">
    <text x="810" y="560" text-anchor="middle" fill="#0A84FF">▼ press</text>
    <text x="989" y="553" text-anchor="middle">固定 / static</text>
    <text x="1300" y="545" text-anchor="middle" fill="#0A84FF">▼ press（optionと同一フレーム）</text>
    <text x="488" y="760" text-anchor="middle" fill="#8E8E93">fn</text>
    <text x="653" y="752" text-anchor="middle" fill="#8E8E93">control</text>
    <text x="810" y="745" text-anchor="middle" fill="#0A84FF">option</text>
    <text x="989" y="738" text-anchor="middle">command ≈1.25u</text>
    <text x="1300" y="730" text-anchor="middle" fill="#0A84FF">space</text>
  </g>

  <!-- focus band -->
  <rect x="730" y="560" width="620" height="150" fill="none" stroke="#30D158" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="1356" y="700" font-size="18" fill="#30D158">ピント面: option 前面 → space 左端</text>

  <!-- key light -->
  <g stroke="#0A84FF" stroke-width="3" fill="#0A84FF">
    <line x1="1820" y1="220" x2="1500" y2="400"/>
    <polygon points="1500,400 1528,372 1520,394 1540,386"/>
  </g>
  <text x="1820" y="200" font-size="20" fill="#0A84FF" text-anchor="end">リムライト（後方右・低い角度・寒色）</text>
  <text x="96" y="380" font-size="20" fill="#8E8E93">補助: 手前左から弱いソフト（リムの1/4）</text>

  <!-- HUD safe zone -->
  <rect x="96" y="880" width="424" height="120" fill="none" stroke="#FF453A" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="112" y="920" font-size="20" fill="#FF453A">HUD「⌥ Space」領域 — 暗く無地</text>
  <text x="112" y="950" font-size="18" fill="#8E8E93">x 96–520 / y 880–1000</text>

  <!-- header -->
  <text x="96" y="110" font-size="18" fill="#8E8E93" font-family="JetBrains Mono, Menlo, monospace">H2R framing guide · 1920×1080 · camera: front-left, 20–25° above key tops · US/ANSI bottom row</text>
  <text x="96" y="150" font-size="26" fill="#F5F5F7">fn / control / option / command / space — option と space の間に必ず command</text>
  <text x="96" y="186" font-size="18" fill="#FF453A">NG: 手・指・道具 / ロゴ / JIS配列（英数キー）/ 正方形キーとスペースの直接隣接</text>
</svg>
